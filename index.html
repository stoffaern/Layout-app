<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gecko Reel Collage</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#fff}
body{display:flex;flex-direction:column}.top{height:46px;flex:none;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #333;font-weight:700}
.app{flex:1;min-height:0;display:flex;gap:10px;padding:10px;justify-content:center}
.controls{width:280px;flex:none;background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.upload{background:#fff;color:#111;border-radius:9px;padding:10px;text-align:center;font-weight:800;cursor:pointer}.upload input{display:none}
.files{display:grid;grid-template-columns:1fr 1fr;gap:5px}.file{font-size:10px;background:#292929;padding:6px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
label.r{font-size:11px;color:#bbb;display:flex;justify-content:space-between}input[type=range]{width:100%}
button{padding:9px;border:0;border-radius:8px;font-weight:700;background:#333;color:#fff}.export{background:#fff;color:#111}
.note{font-size:10px;color:#999;line-height:1.3}.stage{height:100%;min-width:0;display:flex;align-items:center;justify-content:center}
canvas{height:100%;width:auto;max-width:100%;background:#292929;box-shadow:0 8px 30px #0008;touch-action:none}
@media(max-width:650px){.top{height:38px;font-size:13px}.app{padding:5px;gap:5px}.controls{width:145px;padding:6px;gap:5px}.upload{padding:7px 3px;font-size:10px}.files{grid-template-columns:1fr}.file{padding:3px;font-size:8px}label.r{font-size:8px}button{font-size:9px;padding:6px}.note{font-size:8px}}
</style></head><body>
<div class="top">Gecko Reel Collage</div><div class="app">
<div class="controls">
<label class="upload">UPLOAD 4 PHOTOS<input id="pick" type="file" accept="image/*" multiple></label>
<div class="files" id="files"></div>
<div><label class="r"><span>Selected image zoom</span><span id="zv">100%</span></label><input id="zoom" type="range" min="100" max="300" value="100"></div>
<div><label class="r"><span>White lines</span><span id="gv">4 px</span></label><input id="gap" type="range" min="0" max="20" value="4"></div>
<button id="reset">Reset selected crop</button><button class="export" id="save">EXPORT JPEG</button>
<div class="note">Tap a section in the preview, then drag its image to crop. Photos are never stretched.</div>
</div>
<div class="stage"><canvas id="cv" width="1080" height="1920"></canvas></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),pick=document.getElementById('pick'),zoom=document.getElementById('zoom'),gap=document.getElementById('gap');
let a=[0,1,2,3].map(()=>({im:null,name:'',zoom:1,x:0,y:0})),sel=0,drag=false,lx=0,ly=0;
function rows(){let g=+gap.value,h=(1920-g*3)/4;return{g,h}}
function clamp(o,w,h){let mx=Math.max(0,(w-1080)/2),my=Math.max(0,(h-rows().h)/2);o.x=Math.max(-mx,Math.min(mx,o.x));o.y=Math.max(-my,Math.min(my,o.y))}
function draw(){
 ctx.fillStyle='#292929';ctx.fillRect(0,0,1080,1920);let {g,h}=rows();
 a.forEach((o,i)=>{let y=i*(h+g);ctx.save();ctx.beginPath();ctx.rect(0,y,1080,h);ctx.clip();
 if(o.im){let base=Math.max(1080/o.im.naturalWidth,h/o.im.naturalHeight),s=base*o.zoom,w=o.im.naturalWidth*s,hh=o.im.naturalHeight*s;clamp(o,w,hh);ctx.drawImage(o.im,(1080-w)/2+o.x,y+(h-hh)/2+o.y,w,hh)}
 else{ctx.fillStyle='#252525';ctx.fillRect(0,y,1080,h);ctx.fillStyle='#777';ctx.font='42px sans-serif';ctx.textAlign='center';ctx.fillText('Photo '+(i+1),540,y+h/2)}
 ctx.restore();if(i<3){ctx.fillStyle='#fff';ctx.fillRect(0,y+h,1080,g)}
 });
 // selection indicator only in preview, subtle and outside export handled by redraw during save
 ctx.strokeStyle='#4da3ff';ctx.lineWidth=6;ctx.strokeRect(3,sel*(h+g)+3,1074,h-6);
}
function fileList(){let e=document.getElementById('files');e.innerHTML='';a.forEach((o,i)=>{let d=document.createElement('div');d.className='file';d.textContent=(i+1)+'. '+(o.name||'Empty');d.onclick=()=>{sel=i;sync();draw()};e.appendChild(d)})}
function sync(){zoom.value=Math.round(a[sel].zoom*100);document.getElementById('zv').textContent=zoom.value+'%'}
pick.onchange=()=>{let fs=[...pick.files].slice(0,4),loaded=0;if(!fs.length)return;fs.forEach((f,i)=>{let r=new FileReader();r.onload=e=>{let im=new Image();im.onload=()=>{a[i]={im,name:f.name,zoom:1,x:0,y:0};loaded++;fileList();draw()};im.src=e.target.result};r.readAsDataURL(f)});pick.value=''};
zoom.oninput=()=>{a[sel].zoom=+zoom.value/100;document.getElementById('zv').textContent=zoom.value+'%';draw()};gap.oninput=()=>{document.getElementById('gv').textContent=gap.value+' px';draw()};
document.getElementById('reset').onclick=()=>{a[sel].zoom=1;a[sel].x=a[sel].y=0;sync();draw()};
function pos(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*1080/r.width,y:(e.clientY-r.top)*1920/r.height,sx:1080/r.width,sy:1920/r.height}}
cv.onpointerdown=e=>{let p=pos(e),q=rows();sel=Math.max(0,Math.min(3,Math.floor(p.y/(q.h+q.g))));sync();draw();drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture?.(e.pointerId)};
cv.onpointermove=e=>{if(!drag||!a[sel].im)return;let r=cv.getBoundingClientRect();a[sel].x+=(e.clientX-lx)*1080/r.width;a[sel].y+=(e.clientY-ly)*1920/r.height;lx=e.clientX;ly=e.clientY;draw()};cv.onpointerup=cv.onpointercancel=()=>drag=false;
document.getElementById('save').onclick=()=>{if(a.some(o=>!o.im)){alert('Please upload four photos first.');return}
 // draw clean export without blue selection
 ctx.fillStyle='#292929';ctx.fillRect(0,0,1080,1920);let {g,h}=rows();a.forEach((o,i)=>{let y=i*(h+g),base=Math.max(1080/o.im.naturalWidth,h/o.im.naturalHeight),s=base*o.zoom,w=o.im.naturalWidth*s,hh=o.im.naturalHeight*s;clamp(o,w,hh);ctx.save();ctx.beginPath();ctx.rect(0,y,1080,h);ctx.clip();ctx.drawImage(o.im,(1080-w)/2+o.x,y+(h-hh)/2+o.y,w,hh);ctx.restore();if(i<3){ctx.fillStyle='#fff';ctx.fillRect(0,y+h,1080,g)}});
 let url=cv.toDataURL('image/jpeg',.98),link=document.createElement('a');link.href=url;link.download='gecko-reel-collage.jpg';document.body.appendChild(link);link.click();link.remove();setTimeout(draw,100);
};
fileList();sync();draw();
</script></body></html>
